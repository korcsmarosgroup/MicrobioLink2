[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Leila Potari-Gul", email = "l.potari-gul@imperial.ac.uk"},
  {name = "Toby Lawrence", email = "tobylawrence1998@gmail.com"},
]
dependencies = [
    "mygene>=3.2.2",
    "numpy>=1.26.4",
    "omnipath>=1.0.8",
    "pandas>=2.2.2",
    "requests>=2.32.0",
    "scipy>=1.13.1",
]
description = "Prediction of microbe-host protein interactions using domain-motif interactions and intrinsically disordered regions"
license = "BSD-3-Clause"
name = "microbiolink"
readme = "README.md"
requires-python = ">=3.9"
version = "2.1.0"

[project.optional-dependencies]
# Module 10 (microbiolink-enrichment) requires this extra: gget calls the live Enrichr API at
# runtime and matplotlib draws the plot. Both are lazy-imported inside the workflow functions.
enrichment = ["gget>=0.29.0", "matplotlib>=3.8.0"]
idr = ["iupred[aiupred] @ git+https://github.com/saezlab/iupred.git"]
# Module 9 (microbiolink-tiedie) requires this extra: pulls in tiedie (and networkx), Python >=3.9.
tiedie = ["tiedie @ git+https://github.com/saezlab/tiedie.git"]

[project.scripts]
microbiolink-ddi = "microbiolink.cli:ddi"
microbiolink-enrichment = "microbiolink.cli:enrichment"
microbiolink-dmi = "microbiolink.cli:dmi"
microbiolink-download-domains = "microbiolink.cli:download_domains"
microbiolink-download-fasta = "microbiolink.cli:download_fasta"
microbiolink-idr-filter = "microbiolink.cli:idr_filter"
microbiolink-membrane-filter = "microbiolink.cli:membrane_filter"
microbiolink-monte-carlo = "microbiolink.cli:monte_carlo_filter"
microbiolink-tiedie = "microbiolink.cli:tiedie"
microbiolink-zscore-filter = "microbiolink.cli:zscore_filter"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["microbiolink/data/*.tsv"]

[tool.hatch.build.targets.wheel]
packages = ["microbiolink"]

[dependency-groups]
dev = [
    "ruff>=0.9",
]
