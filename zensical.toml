[project]
site_url = "https://microbiolink2.readthedocs.io/"
site_name = "MicrobioLink"
site_description = "Predicting host-microbe interactions and their downstream effects on host cells"

repo_url = "https://github.com/korcsmarosgroup/MicrobioLink2"
repo_name = "korcsmarosgroup/MicrobioLink2"

nav = [
  { "Introduction" = "index.md" },
  { "Get Started" = "get-started.md" },
  { "Pipeline Concepts" = "concepts.md" },
  { "Tutorials" = [
      { "Overview" = "tutorials/index.md" },
      { "1 · API, comprehensive" = "tutorials/t1_api_full.md" },
      { "2 · API, basic" = "tutorials/t2_api_basic.md" },
      { "3 · CLI, comprehensive" = "tutorials/t3_cli_full.md" },
      { "4 · CLI, basic" = "tutorials/t4_cli_basic.md" },
  ] },
  { "API Reference" = "api/index.md" },
]

# API documentation is generated statically from the microbiolink/workflow/
# docstrings by mkdocstrings-python (griffe). Heavy runtime deps are imported
# lazily inside functions, so the reference renders without installing them.
# paths = ["."] is the repo root so griffe resolves microbiolink.workflow.*.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
options.docstring_style = "google"
options.show_root_heading = true
options.show_source = false

[project.theme]
language = "en"
logo = "assets/microbiolink_logo.png"
favicon = "assets/microbiolink_logo.png"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/korcsmarosgroup/MicrobioLink2"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
